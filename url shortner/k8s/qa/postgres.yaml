apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-migrations
  namespace: qa
data:
  001_schema.sql: |
    CREATE TABLE IF NOT EXISTS links (
        id         SERIAL PRIMARY KEY,
        code       TEXT NOT NULL DEFAULT '',
        url        TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE UNIQUE INDEX IF NOT EXISTS links_code ON links (code) WHERE code <> '';

    CREATE TABLE IF NOT EXISTS clicks (
        id         SERIAL PRIMARY KEY,
        link_id    INT NOT NULL REFERENCES links(id) ON DELETE CASCADE,
        referrer   TEXT NOT NULL DEFAULT '',
        clicked_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS clicks_link ON clicks (link_id, clicked_at DESC);
  002_seed.sql: |
    INSERT INTO links (code, url) VALUES
        ('welcome', 'https://docs.docker.com/get-started/'),
        ('circleci', 'https://circleci.com/docs/'),
        ('git',      'https://git-scm.com/book/en/v2')
    ON CONFLICT DO NOTHING;

    INSERT INTO clicks (link_id, referrer, clicked_at)
    SELECT l.id,
           (ARRAY['', 'https://t.co/x', 'https://news.ycombinator.com/', 'https://google.com/'])[1 + (random()*3)::int],
           now() - (random() * interval '14 days')
    FROM links l, generate_series(1, 40)
    WHERE l.code <> ''
    ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qa
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "url_shortener"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          volumeMounts:
            - name: migrations-vol
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["psql", "-U", "postgres", "-d", "url_shortener", "-c", "SELECT 1"]
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["psql", "-U", "postgres", "-d", "url_shortener", "-c", "SELECT 1"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: migrations-vol
          configMap:
            name: postgres-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qa
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
