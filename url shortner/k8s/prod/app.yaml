apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-app
  namespace: prod
  labels:
    app: url-shortener-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-app
  template:
    metadata:
      labels:
        app: url-shortener-app
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: app
          image: nikhil1403621/url-shortener-python:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/url_shortener"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-app
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: url-shortener-app
  ports:
    - port: 8080
      targetPort: 8080
